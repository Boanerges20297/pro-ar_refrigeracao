<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b4f8a">
  <title>Sem conexão | ProntoAr</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 2rem; display: grid; place-items: center;
           font-family: system-ui, -apple-system, sans-serif; background: #f8fafc; color: #0f172a; }
    main { max-width: 29rem; text-align: center; padding: 2.5rem 2rem; background: white;
           border: 1px solid #e2e8f0; border-radius: 1.25rem; box-shadow: 0 8px 32px #0f172a0d; }
    .symbol { font-size: 3rem; line-height: 1; color: #0b4f8a; }
    h1 { font-size: 1.5rem; margin: 1.5rem 0 0.75rem; }
    p { color: #475569; line-height: 1.6; }
    a { display: inline-block; margin-top: 1rem; padding: .8rem 1.4rem; border-radius: .65rem;
        color: white; background: #0b4f8a; text-decoration: none; font-weight: 650; }
    a:focus-visible { outline: 3px solid #38bdf8; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <div class="symbol" aria-hidden="true">❄</div>
    <h1>Sem conexão com a internet</h1>
    <p>O ProntoAr precisa de conexão para consultar e atualizar ordens de serviço com segurança.
       Nenhum dado de clientes ou atendimento foi salvo para uso offline.</p>
    <a href="/">Tentar novamente</a>
  </main>
</body>
</html>
