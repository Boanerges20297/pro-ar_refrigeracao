name: Testes automatizados

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Smoke e regressão
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SECRET_KEY: ci-test-secret-key
      JWT_SECRET_KEY: ci-test-jwt-secret-key
      DATABASE_URL: "sqlite:///:memory:"
      WTF_CSRF_SSL_STRICT: "false"
      SECURITY_ENFORCE_SAME_ORIGIN_MUTATIONS: "false"
      SECURITY_BIND_JWT_SESSION_NONCE: "false"
      SECURITY_BIND_JWT_USER_AGENT: "false"
      LICENSE_ALLOW_LEGACY_TOKENS: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Verificar compilação Python
        run: python -m compileall -q app

      - name: Executar testes
        run: python -m pytest -q
