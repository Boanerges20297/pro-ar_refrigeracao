{% extends "base.html" %}{% block title %}Visualizar portal do cliente{% endblock %}{% block content %}
<div class="mx-auto max-w-3xl rounded-2xl border border-gray-200 bg-white p-6 shadow-sm"><p class="text-sm font-semibold text-indigo-600"><i class="fas fa-user-shield mr-2"></i>Modo Superadmin</p><h1 class="mt-1 text-2xl font-bold text-gray-900">Visualizar como usuário</h1><p class="mt-2 text-sm text-gray-500">Escolha qualquer usuário ativo para validar o contexto de acesso dele.</p><form method="post" class="mt-6 flex flex-col gap-3 sm:flex-row"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><select name="client_user_id" required class="min-w-0 flex-1 rounded-lg border border-gray-300 px-3 py-3"><option value="">Selecione um usuário</option>{% for client_user in client_users %}<option value="{{ client_user.id }}">{{ client_user.name }} — {{ client_user.email }} ({{ client_user.permission_level }}){% if client_user.client_record %} — {{ client_user.client_record.name }}{% endif %}</option>{% endfor %}</select><button class="rounded-lg bg-indigo-600 px-5 py-3 font-bold text-white hover:bg-indigo-700"><i class="fas fa-eye mr-2"></i>Visualizar acesso</button></form></div>
{% endblock %}
